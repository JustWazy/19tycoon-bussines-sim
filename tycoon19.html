<style>

.w{display:block;max-width:1040px}
#tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:8;display:flex;flex-direction:row;overflow-x:auto;background:var(--bg);border-top:1px solid var(--t);margin:0;padding:0 6px env(safe-area-inset-bottom,0px);align-self:auto}

body{padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}

.mi i{font:400 11px var(--mo);color:var(--m);font-style:normal}.mi b{font:900 22px/1 var(--d);letter-spacing:.04em;text-transform:uppercase}.mi span{font:400 11px var(--mo);color:var(--m);text-align:right;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi:hover{background:var(--t);color:var(--bg)}.mi:hover i,.mi:hover span{color:var(--bg)}

</style></head><body><div class="w">
<div class="c"><div id="hd"><div><b class="lg">TYCOON 19</b> &nbsp;<span id="dt" class="m"></span></div><div id="nx"><button class="x" onclick="nxt(7)">+7 hari</button><button class="x" onclick="nxt(30)">+30 hari</button><button onclick="nxt(1)">LANGKAH SELANJUTNYA</button></div></div><div id="top" class="g" style="margin-top:8px"></div><div id="logs" class="m" style="margin-top:8px"></div></div>
<div id="tabs"></div><div id="main"></div></div>
<div id="pn"><div id="pb"><button class="b" onclick="tab=null;ren()">← Kembali</button><img id="pi" alt=""><b id="pt"></b><span id="ph"></span><button class="b" onclick="nxt(1)">+1 hari</button></div><div id="pm"></div></div>
<div id="ov"><div><h2 id="ot"></h2><p id="om"></p><button class="b" onclick="localStorage.removeItem('t19');location.reload()">Main Lagi</button></div></div>
<script>
const $=i=>document.getElementById(i),cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)),rn=(a,b)=>a+Math.random()*(b-a),pk=a=>a[Math.random()*a.length|0];
const R=n=>{n=Math.round(n);const a=Math.abs(n);return(n<0?'-':'')+'Rp '+(a>=1e12?(a/1e12).toFixed(2)+' T':a>=1e9?(a/1e9).toFixed(2)+' M':a>=1e6?(a/1e6).toFixed(2)+' jt':a.toLocaleString('id-ID'))};
const DN=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
const H=[['Kos',25e3],['Kontrakan',70e3],['Apartemen',180e3]],F=[['Hemat',25e3],['Normal',55e3],['Premium',130e3]],I=[['Tanpa asuransi',0],['BPJS',8e3],['Asuransi swasta',35e3]];
const AS=[['BNUS','Bank Nusantara','Saham',9000,.02],['TLKM','Telko Raya','Saham',3800,.018],['GOTO','Gojek Tech','Saham',80,.05],['ANTM','Tambang Emas','Saham',1600,.03],['XAU','Emas (gram)','Komoditas',1.3e6,.01],['OIL','Minyak Mentah','Komoditas',1.1e6,.025],['KPI','Kopi Arabika','Komoditas',95e3,.02],['BTC','Bitcoin','Kripto',1e9,.06],['ETH','Ethereum','Kripto',5e7,.07]];
const NW=[['Bank Sentral menurunkan suku bunga','Ekonomi','Saham',.006,8,.05],['Inflasi global melonjak','Ekonomi','Komoditas',.005,8,-.05],['Harga minyak naik akibat konflik','Politik','OIL',.012,6,-.03],['Panen kopi gagal di Brasil','Ekonomi','KPI',.015,6,0],['Regulator memperketat aturan kripto','Politik','Kripto',-.02,6,-.02],['Institusi besar memborong Bitcoin','Ekonomi','BTC',.02,5,.02],['Resesi dunia mengancam','Ekonomi','Saham',-.012,10,-.1],['Ekonomi tumbuh melampaui target','Ekonomi','Saham',.008,10,.1],['Ketegangan geopolitik, emas jadi safe haven','Politik','XAU',.01,8,0],['Subsidi UMKM diumumkan pemerintah','Politik','Saham',.003,6,.1],['Skandal korupsi guncang bursa','Politik','Saham',-.01,5,-.04],['Booming properti di kota besar','Ekonomi','PROP',.004,15,.03]];
const JB=[['Pelayan Kafe',120e3,{}],['Staf Admin',200e3,{com:1}],['Programmer Junior',350e3,{tech:2}],['Analis Keuangan',500e3,{fin:3}],['Manajer Operasional',800e3,{biz:4,com:3}]];
const SKN={biz:'Manajemen Bisnis',fin:'Keuangan & Investasi',com:'Komunikasi',tech:'Teknologi'};
const PR=[['Kamar Kos (5 pintu)',150e6,.07],['Apartemen Studio',500e6,.06],['Rumah Tinggal',1.2e9,.05],['Ruko Komersial',3e9,.08],['Gedung Perkantoran',15e9,.09]];
const BD=[['ORI Negara',.06,180,0],['Sukuk Ritel',.07,120,.01],['Obligasi Korporasi',.11,90,.15]];
const ST=[['Asisten Pribadi',120e3,'+2 jam waktu per hari'],['Akuntan',150e3,'Biaya operasional bisnis -10%'],['Manajer Pemasaran',150e3,'Permintaan bisnis +15%, popularitas naik'],['Sekretaris',100e3,'Jaringan tumbuh 2x lebih cepat'],['Dokter Pribadi',200e3,'Kesehatan pulih tiap hari, tanpa biaya sakit']];
const OF=[['Ketua RT',20,10,2e6,20e3],['Anggota DPRD',40,30,50e6,150e3],['Wali Kota',60,50,500e6,400e3],['Gubernur',75,70,3e9,1e6],['Presiden',90,85,20e9,4e6]];
const GL=[['Punya kekayaan Rp 100 jt',()=>nw()>=1e8],['Dirikan bisnis pertama',()=>S.biz],['Kekayaan Rp 1 Miliar',()=>nw()>=1e9],['Punya properti',()=>S.props.length],['Punya obligasi / deposito',()=>S.bonds.length||S.dep>0],['Kepopuleran 70+',()=>S.pop>=70],['Skill Manajemen Bisnis level 5',()=>S.sk.biz>=5],['Menjabat di politik',()=>S.office>0],['Bisnis level 5',()=>S.biz&&S.biz.lv>=5],[' SASARAN AKHIR: Kekayaan Rp 10 Miliar',()=>nw()>=1e10]];
const T=[['news','','Berita'],['exp','','Pengeluaran'],['skills','','Skill'],['trade','','Trading'],['job','','Kerja'],['biz','','Bisnis'],['leis','','Waktu Luang'],['prop','','Properti'],['bond','','Obligasi'],['netw','','Jaringan'],['pop','⭐','Popularitas'],['goal','','Sasaran'],['pol','','Politik'],['staff','','Staf'],['bank','','Bank']];
let S,tab=null;
function init(){S={d:0,cash:5e6,hp:80,hap:60,str:20,pop:10,net:5,hrs:10,mg:0,sk:{biz:0,fin:0,com:0,tech:0},house:0,food:1,ins:0,job:null,biz:null,hold:{},px:{},pv:{},props:[],pi:1,bonds:[],dep:0,loan:0,staff:[],office:0,camp:null,tax:.1,eco:1,news:[],logs:[],fx:[],ex:{},inc:{},bl:null,won:0,over:0};AS.forEach(a=>S.px[a[0]]=a[3])}
try{S=JSON.parse(localStorage.getItem('t19'))}catch(e){}if(!S)init();
const sv=()=>{try{localStorage.setItem('t19',JSON.stringify(S))}catch(e){}};
const log=m=>{S.logs.unshift('Hari '+S.d+': '+m);S.logs.length=Math.min(S.logs.length,30)};
const st=n=>S.staff.includes(n)?1:0,use=h=>S.hrs>=h?(S.hrs-=h,1):(log(' Waktu hari ini tidak cukup ('+h+' jam)'),0),pay=a=>S.cash>=a?(S.cash-=a,1):(log(' Uang tidak cukup'),0);
function nw(){let v=S.cash+S.dep-S.loan;AS.forEach(a=>{const h=S.hold[a[0]];if(h)v+=h.q*S.px[a[0]]});S.props.forEach(i=>v+=PR[i][1]*S.pi);S.bonds.forEach(b=>v+=b.amt);if(S.biz)v+=S.biz.lv*8e6;return v}
function bizDay(){const b=S.biz,lv=b.lv,u=35e3*lv**1.3,pm={.8:1.3,1:1,1.25:.75,1.5:.55}[b.price];let c=(12*lv+b.mkt/8e3+S.pop/4)*(.6+.4*S.eco)*(.7+.3*b.qual)*pm*(1+S.sk.biz*.02)*(S.mg?1.15:1)*(1+.15*st('Manajer Pemasaran'))*(1+S.net/200);c=Math.round(c*rn(.85,1.15)*(1-S.str/300));const rev=c*u*b.price,vc=c*u*(.4+.08*b.qual)*(1-Math.min(.3,S.sk.biz*.03)-.1*st('Akuntan')),fx=lv*6e4+b.mkt,pr=rev-vc-fx;return{c,rev,pr,tax:pr>0?pr*S.tax:0}}
function tick(){S.d++;const wd=S.d%7,wk=wd<5,ex={Sewa:H[S.house][1],Makan:F[S.food][1],Kesehatan:I[S.ins][1],Tagihan:25e3,Staf:0,Pajak:0,Bunga:0},inc={Gaji:0,Bisnis:0,'Sewa properti':0,'Bunga deposito':0,Kupon:0,Jabatan:0};
S.staff.forEach(n=>ex.Staf+=ST.find(s=>s[0]==n)[1]);
if(S.job&&wk)inc.Gaji=JB[S.job][1]*(1-S.str/250)*(1+S.sk.com*.03);
if(S.biz){S.bl=bizDay();inc.Bisnis=S.bl.pr;ex.Pajak=S.bl.tax}
S.props.forEach(i=>inc['Sewa properti']+=PR[i][1]*PR[i][2]/365*S.pi);
const dr=(.04+S.sk.fin*.002)/365;inc['Bunga deposito']=S.dep*dr;S.dep+=inc['Bunga deposito'];
const lr=Math.max(.06,.12-S.sk.fin*.005-S.net*.0005)/365;ex.Bunga=S.loan*lr;S.loan+=ex.Bunga;ex.Bunga=0;
if(S.office)inc.Jabatan=OF[S.office-1][4];
S.bonds=S.bonds.filter(b=>{if((S.d-b.st)%30==0&&S.d>b.st){const k=b.amt*b.y/12;inc.Kupon+=k}if(S.d>=b.end){if(Math.random()<b.rk){log(' '+b.n+' gagal bayar! Modal hangus');return 0}S.cash+=b.amt;log(' '+b.n+' jatuh tempo, modal kembali');return 0}return 1});
if(Math.random()<.015){const c=S.ins||st('Dokter Pribadi')?3e5:2e6;ex.Kesehatan+=st('Dokter Pribadi')?0:c;S.hp-=st('Dokter Pribadi')?4:12;log(' Jatuh sakit')}
let i=0,o=0;for(const k in inc)i+=inc[k];for(const k in ex)o+=ex[k];S.cash+=i-o;S.ex=ex;S.inc=inc;
if(S.cash<0){S.loan+=-S.cash;S.cash=0;log(' Saldo minus, otomatis jadi pinjaman')}
S.str=cl(S.str+(S.job&&wk?2:0)+(S.biz?1:0)-1.2);S.hap=cl(S.hap-.4+(S.house+S.food)*.15-(S.str>70?.6:0));
S.hp=cl(S.hp+(S.food-1)*.25+(S.house-1)*.1-(S.str>75?1:0)+(S.food==0?-.2:.05)+st('Dokter Pribadi')*.3);S.pop=cl(S.pop-.1+st('Manajer Pemasaran')*.1);
S.eco+=(1-S.eco)*.03+rn(-.01,.01);S.pi*=1+rn(-.003,.0035);S.fx=S.fx.filter(f=>--f.d>0);
if(Math.random()<.4){const n=pk(NW),rm=Math.random()<.4,fl=rm&&Math.random()<.35;const e=fl?-n[3]:n[3];S.fx.push({t:n[2],e,d:n[4]});S.eco=cl(S.eco+(fl?-n[5]:n[5]),.6,1.5);S.news.unshift({d:S.d,t:(rm?'Rumor: ':'')+n[0],c:rm?'Rumor':n[1],up:e>0});if(S.news.length>40)S.news.length=40}
AS.forEach(a=>{let e=0;S.fx.forEach(f=>{if(f.t==a[0]||f.t==a[2])e+=f.e});S.pv[a[0]]=S.px[a[0]];S.px[a[0]]=Math.max(1,S.px[a[0]]*(1+rn(-a[4],a[4])+e+.0002))});
if(S.camp&&S.d>=S.camp.end){const o=OF[S.camp.i],ch=cl(.25+S.camp.sp/o[3]*.15+(S.pop-o[1])/200+(S.net-o[2])/300,.1,.9);if(Math.random()<ch){S.office=S.camp.i+1;S.pop=cl(S.pop+10);log(' Anda terpilih menjadi '+o[0])}else log(' Anda kalah pemilihan '+o[0]);S.camp=null}
S.hrs=10+2*st('Asisten Pribadi')-(S.job&&wk?6:0);S.mg=0;
if(S.hp<=0||nw()<-3e7){S.over=1;fin('Game Over',S.hp<=0?'Kesehatan Anda habis di usia '+(19+(S.d/365|0))+' tahun.':'Anda bangkrut dan terlilit utang.')}}
function fin(t,m){$('ot').textContent=t;$('om').textContent=m;$('ov').style.display='flex'}
function nxt(n){for(let i=0;i<n&&!S.over;i++)tick();if(!S.won&&nw()>=1e10){S.won=1;fin(' Anda Menang!','Kekayaan Rp 10 Miliar tercapai di usia '+(19+(S.d/365|0))+' tahun. Anda boleh lanjut bermain.')}ren()}
const bt=(l,f,d)=>`<button class="b" ${d?'disabled':''} onclick="${f};ren()">${l}</button>`,row=(a,b)=>`<div class="r"><div>${a}</div><div>${b}</div></div>`,card=(t,b)=>`<div class="c"><h3>${t}</h3>${b}</div>`;
const bar=(l,v,c)=>`<div class="s"><small>${l}: ${Math.round(v)}</small><div class="bar"><i style="width:${v}%;background:${c}"></i></div></div>`;
function buy(id,a){const f=a*(.003-Math.min(.002,S.sk.fin*.0002));if(!pay(a))return;const h=S.hold[id]||(S.hold[id]={q:0,c:0});h.q+=(a-f)/S.px[id];h.c+=a}
function sell(id,p){const h=S.hold[id];if(!h)return;const q=h.q*p,v=q*S.px[id]*(1-.003);S.cash+=v;h.c*=1-p;h.q-=q;if(h.q<1e-9)delete S.hold[id];log('Jual '+id+' '+R(v))}
function course(k){const l=S.sk[k];if(l>=10)return;const c=3e5*(l+1)**1.5;if(S.hrs>=3&&S.cash>=c){pay(c);use(3);S.sk[k]++;S.hap=cl(S.hap+1);log(' '+SKN[k]+' naik ke level '+(l+1))}else log('Butuh '+R(c)+' dan 3 jam')}
function gig(k){const g={ojek:[3,()=>rn(1e5,2e5),4],free:[3,()=>1.5e5+S.sk.tech*7e4,5],jual:[2,()=>rn(6e4,2.5e5)*(1+S.sk.biz*.1),3]}[k];if(!use(g[0]))return;const v=g[1]()*(1-S.str/300);S.cash+=v;S.str=cl(S.str+g[2]);log(' Kerja sampingan +'+R(v))}
function leis(k){const o={hobi:[2,5e4,-10,6,0],rest:[4,0,-12,2,6],gym:[2,3e4,-4,2,3],lib:[10,3e6,-40,25,4]}[k];if(S.hrs<o[0])return log(' Waktu tidak cukup');if(!pay(o[1]))return;S.hrs-=o[0];S.str=cl(S.str+o[2]);S.hap=cl(S.hap+o[3]);S.hp=cl(S.hp+o[4])}
function netw(k){const m=S.staff.includes('Sekretaris')?2:1,g=1+S.sk.com*.2;if(k=='ngopi'){if(!pay(1e5)||!use(2))return;S.net=cl(S.net+2*m*g)}
else if(k=='lobi'){if(S.cash<2e6||S.hrs<3)return log('Butuh Rp 2 jt & 3 jam');pay(2e6);use(3);S.net=cl(S.net+6*m*g);S.pop=cl(S.pop+1)}
else{if(!S.biz)return log('Butuh bisnis untuk pitching ke investor');if(S.net<15)return log('Jaringan minimal 15');if(!pay(5e5)||!use(3))return;if(Math.random()<(S.net+S.pop+S.sk.com*5)/220){const f=S.biz.lv*15e6*(1+S.net/20);S.cash+=f;log(' Investor menyuntik dana '+R(f))}else log('Investor menolak pitching Anda')}}
function popa(k){const o={sos:[1,0,rn(1,3)],inf:[0,5e5,4],amal:[1,5e6,8],tv:[2,2e7,12]}[k];if(S.hrs<o[0])return log(' Waktu tidak cukup');if(!pay(o[1]))return;S.hrs-=o[0];S.pop=cl(S.pop+o[2])}
function bond(i,a){if(!pay(a))return;const b=BD[i];S.bonds.push({n:b[0],amt:a,y:b[1],st:S.d,end:S.d+b[2],rk:b[3]})}
function bank(k,a){if(k=='dep'){a=a=='all'?S.cash:a;if(S.cash>=a&&a>0){S.cash-=a;S.dep+=a}}else if(k=='wd'){S.cash+=S.dep;S.dep=0}else if(k=='loan'){const lim=Math.max(5e6,nw()*.5);if(S.loan+a<=lim){S.loan+=a;S.cash+=a}else log('Melebihi batas kredit '+R(lim))}else{const p=Math.min(S.cash,S.loan);S.cash-=p;S.loan-=p}}
function buyP(i){const p=PR[i][1]*S.pi;if(pay(p))S.props.push(i)}
function sellP(x){const i=S.props.splice(x,1)[0];S.cash+=PR[i][1]*S.pi*.97}
function hire(n){const s=ST.find(x=>x[0]==n);if(S.staff.includes(n))S.staff=S.staff.filter(x=>x!=n);else{S.staff.push(n);if(n=='Asisten Pribadi')S.hrs+=2}}
function runP(i){const o=OF[i];S.camp={i,sp:o[3],end:S.d+14}}
function bribe(){if(S.office<1)return;if(!pay(5e6))return;S.tax=Math.max(0,S.tax-.02);if(Math.random()<.25){S.pop=cl(S.pop-15);S.cash-=1e7;log(' Suap terbongkar! Denda Rp 10 jt, popularitas anjlok')}}

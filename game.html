netw(){const ch=S.chat;return card('Jaringan Sosial · '+Math.round(S.net)+'/100',bar('Koneksi',S.net,'#3b82f6'))+(ch?card('Percakapan Terakhir · '+ch.who+' ('+ch.role+') · hari '+ch.d,ch.lines.map(x=>`<div style="padding:6px 0 6px 10px;border-left:3px solid ${x[0]=='Anda'?'var(--a)':'var(--l)'};margin-bottom:6px"><div class="m" style="text-transform:uppercase;font-size:10px;letter-spacing:.08em">${x[0]=='Anda'?'Anda':ch.who}</div>${x[1]}</div>`).join('')+`<div class="m" style="border-top:1px solid var(--l);padding-top:6px">${ch.res}</div>`):'')+card('Temui Seseorang',Object.entries(MK).map(([k,K])=>row(`<b>${K[0]}</b><div class="m">${K[1]} jam · ${R(K[2])}${K[4]?' · '+K[4]:''}</div>`,bt('Temui',`meet('${k}')`))).join('')+'<div class="m">Isi percakapan dan hasilnya bergantung pada kondisimu: kesehatan, stres, utang, bisnis, popularitas, dan kekayaan.</div>')+card('Kegiatan Lain',row('Ngopi bareng kolega (2 jam, Rp 100 rb)',bt('Lakukan',"netw('ngopi')"))+row('Lobi tokoh penting (3 jam, Rp 2 jt)',bt('Lakukan',"netw('lobi')"))+row('Pitching ke investor (3 jam, Rp 500 rb; min. jaringan 15, perlu bisnis)',bt('Lakukan',"netw('inv')")))},
chat(){const cur=CT.find(c=>c[0]==S.chatId);
if(!cur)return card('Interaksi Sosial',CT.map(c=>row(`<b>${c[1]}</b> <span class="m">${c[2]}</span>`,bt('Buka obrolan',`chatOpen('${c[0]}')`))).join('')+'<div class="m">Pilih gaya bicara yang cocok dengan lawan bicaramu. Setiap orang menyukai pendekatan berbeda.</div>');
const bub=S.chatMsgs.map(m=>`<div style="display:flex;justify-content:${m[0]=='me'?'flex-end':'flex-start'};margin:6px 0"><div style="max-width:78%;padding:8px 11px;background:${m[0]=='me'?'var(--t)':'var(--l)'};color:${m[0]=='me'?'var(--bg)':'var(--t)'}">${m[1]}</div></div>`).join('');
const opts=S.chatDone?row('<span class="m">'+(S.chatFx.join(' · ')||'Tidak ada dampak')+'</span>',bt('Percakapan baru','S.chatId=null')):CO.map(o=>row(o[1],bt('Pilih',`chatPick('${o[0]}')`))).join('');
return card('Ngobrol dengan '+cur[1]+' · <span class="m">'+cur[2]+'</span>',bub)+card(S.chatDone?'Selesai':'Pilih Respons',opts)+row('',bt('← Ganti orang','S.chatId=null'))},
pop(){return card('Kepopuleran · '+Math.round(S.pop)+'/100',bar('Reputasi',S.pop,'#f59e0b')+row(' Posting media sosial (1 jam)',bt('Lakukan',"popa('sos')"))+row(' Endorse influencer (Rp 500 rb)',bt('Lakukan',"popa('inf')"))+row(' Sponsor kegiatan amal (1 jam, Rp 5 jt)',bt('Lakukan',"popa('amal')"))+row(' Iklan TV (2 jam, Rp 20 jt)',bt('Lakukan',"popa('tv')"))+'<div class="m">Popularitas menarik pelanggan & dibutuhkan untuk politik. Turun pelan tiap hari.</div>')},
goal(){return card('Sasaran ('+GL.filter(g=>g[1]()).length+'/'+GL.length+')',GL.map(g=>row(g[0],g[1]()?'<span class="p">✔ Selesai</span>':'<span class="m">Belum</span>')).join(''))},
pol(){return card('Politik · '+(S.office?OF[S.office-1][0]:'Warga biasa'),(S.camp?row('Kampanye '+OF[S.camp.i][0]+' berjalan','<span class="m">Pemilu hari '+S.camp.end+'</span>'):'')+OF.map((o,i)=>row(`<b>${o[0]}</b><div class="m">Popularitas ≥${o[1]}, jaringan ≥${o[2]}, biaya kampanye ${R(o[3])}, gaji ${R(o[4])}/hari</div>`,bt(S.office>i?'Dijabat':'Maju',`runP(${i})`,S.office>i||S.camp||S.pop<o[1]||S.net<o[2]||S.cash<o[3]||(S.office>0&&i<S.office)))).join(''))+card('Kontrol Regulasi (khusus pejabat)',row('Pajak bisnis: '+(S.tax*100).toFixed(0)+'%',bt('Turunkan','S.tax=Math.max(0,S.tax-.02)',!S.office)+bt('Naikkan','S.tax=Math.min(.3,S.tax+.02)',!S.office))+row('Suap kebijakan (Rp 5 jt, pajak -2%, risiko ketahuan 25%)',bt('Suap','bribe()',!S.office)))},
staff(){return card('Staf (bisa dipekerjakan bersamaan)',ST.map(s=>row(`<b>${s[0]}</b> · ${R(s[1])}/hari<div class="m">${s[2]}</div>`,bt(S.staff.includes(s[0])?'Pecat':'Rekrut',`hire('${s[0]}')`))).join(''))},
bank(){const lim=Math.max(5e6,nw()*.5);return card('Rekening',`<div class="g"><div class="s"><small>Tunai</small>${R(S.cash)}</div><div class="s"><small>Deposito (~${(4+S.sk.fin*.2).toFixed(1)}%/thn)</small>${R(S.dep)}</div><div class="s"><small>Utang</small><span class="n">${R(S.loan)}</span></div><div class="s"><small>Kekayaan bersih</small>${R(nw())}</div></div>`)+card('Deposito',row('Setor',bt('1 jt',"bank('dep',1e6)")+bt('10 jt',"bank('dep',1e7)")+bt('Semua tunai',"bank('dep','all')"))+row('Tarik semua',bt('Tarik',"bank('wd')")))+card('Kredit (batas '+R(lim)+', bunga ~12%/thn)',row('Ajukan pinjaman',bt('10 jt',"bank('loan',1e7)")+bt('100 jt',"bank('loan',1e8)")+bt('1 M',"bank('loan',1e9)"))+row('Bayar cicilan (pakai tunai)',bt('Lunasi/bayar',"bank('pay')")))}};
const MS={news:()=>S.news[0]?S.news[0].t.slice(0,26):'kosong',chat:()=>S.chatId?'Ngobrol: '+CT.find(c=>c[0]==S.chatId)[1]:'Mulai obrolan',exp:()=>R(Object.values(S.ex).reduce((a,b)=>a+b,0))+'/hari',skills:()=>'Total Lv '+Object.values(S.sk).reduce((a,b)=>a+b,0),trade:()=>R(AS.reduce((v,a)=>v+(S.hold[a[0]]?S.hold[a[0]].q*S.px[a[0]]:0),0)),job:()=>S.job!=null?JB[S.job][0]:'Menganggur',biz:()=>S.bizs.length+' bisnis',leis:()=>'Stres '+Math.round(S.str),prop:()=>S.props.length+' unit',bond:()=>S.bonds.length+' aktif',netw:()=>Math.round(S.net)+'/100',pop:()=>Math.round(S.pop)+'/100',goal:()=>GL.filter(g=>g[1]()).length+'/'+GL.length,pol:()=>S.office?OF[S.office-1][0]:'Warga',staff:()=>S.staff.length+' orang',bank:()=>'Utang '+R(S.loan)};
const IC={"news": "M4 5h16v14H4zM8 9h5M8 13h8M8 16h8", "exp": "M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6", "skills": "M2 9l10-5 10 5-10 5zM6 11.5V16c0 1 3 2.5 6 2.5s6-1.5 6-2.5v-4.5", "trade": "M3 20h18M5 15l4-4 3 3 6-7M14 7h4v4", "job": "M3 8h18v11H3zM9 8V5h6v3M3 13h18", "biz": "M3 20V11l6 3.5V11l6 3.5V5h3v15zM3 20h18", "leis": "M12 8a4 4 0 100 8 4 4 0 000-8M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2", "prop": "M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6", "bond": "M4 4h16v13H4zM8 9h8M8 12h5M9 17v4l3-1.5 3 1.5v-4", "netw": "M12 4a2.5 2.5 0 100 5 2.5 2.5 0 000-5M5 15a2.5 2.5 0 100 5 2.5 2.5 0 000-5M19 15a2.5 2.5 0 100 5 2.5 2.5 0 000-5M11 9l-5 6M13 9l5 6M7.5 17.5h9", "pop": "M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z", "goal": "M12 3a9 9 0 100 18 9 9 0 000-18M12 8a4 4 0 100 8 4 4 0 000-8M12 11.5v1", "pol": "M3 9l9-5 9 5zM5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18", "staff": "M9 11a3 3 0 100-6 3 3 0 000 6M3 20c0-3.5 2.5-6 6-6s6 2.5 6 6M16 6a3 3 0 010 6M18 14c2 .8 3 3 3 6", "bank": "M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 7v5c0 1.7 3.6 3 8 3s8-1.3 8-3V7M4 12v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"};
const IA={"BNUS": "M3 9l9-5 9 5zM5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18", "TLKM": "M12 11v10M8 21h8M12 11l-4 10M12 11l4 10M8.5 7.5a5 5 0 017 0M6 5a8.5 8.5 0 0112 0", "GOTO": "M6 14a3 3 0 100 6 3 3 0 000-6M18 14a3 3 0 100 6 3 3 0 000-6M9 17h6l-2-6H9M13 11l2-3h3", "ANTM": "M4 9c4-5 12-5 16 0M12 6l1 14M10 20h5", "XAU": "M6 9h12l3 8H3zM9 9l-1.5 8M15 9l1.5 8", "OIL": "M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z", "KPI": "M5 8h11v6a5 5 0 01-5 5H10a5 5 0 01-5-5zM16 10h2a2 2 0 010 4h-2M8 3v2M11 3v2", "BTC": "M12 3a9 9 0 100 18 9 9 0 000-18M10 8v8M10 8h3a2 2 0 010 4h-3M10 12h3.5a2 2 0 010 4H10M11 6v2M13 6v2M11 16v2M13 16v2", "ETH": "M12 3l6 9-6 9-6-9zM6 12l6 3 6-3M12 3v12"};
const sv_=(d,z,x)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" ${x||''}><path d="${d}"/></svg>`;
const ai=id=>sv_(IA[id],26,'style="float:left;margin:2px 10px 0 0"');
function tf(e){const x=['jpg','jpeg','png','webp'],n=+e.dataset.n+1;if(n<x.length){e.dataset.n=n;e.src='thumb/'+e.dataset.id+'.'+x[n]}else e.remove()}
let lt=null;
const spark=id=>{const h=(S.hist&&S.hist[id])||[];if(h.length<2)return'';const mn=Math.min(...h),mx=Math.max(...h),w=96,hh=30,g=mx-mn||1,pts=h.map((v,k)=>(k/(h.length-1)*w).toFixed(1)+','+(hh-2-(v-mn)/g*(hh-4)).toFixed(1)).join(' '),up=h[h.length-1]>=h[0];return `<svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" style="vertical-align:middle;margin-right:6px"><polyline points="${pts}" fill="none" stroke="var(--${up?'up':'a'})" stroke-width="1.5" stroke-linejoin="round"/></svg>`};

$('top').innerHTML=`<div class="s"><small>Tunai</small><b>${R(S.cash)}</b></div><div class="s"><small>Kekayaan</small><b>${R(nw())}</b></div><div class="s"><small> Waktu tersisa</small><b>${S.hrs} jam</b></div>`+bar(' Kesehatan',S.hp,'#ef4444')+bar(' Bahagia',S.hap,'#22c55e')+bar(' Stres',S.str,'#a855f7')+bar('⭐ Populer',S.pop,'#f59e0b')+bar(' Jaringan',S.net,'#3b82f6');
$('main').innerHTML='<div id="mn">'+menu()+'</div>'+'';const pn=$('pn');pn.style.display=tab?'block':'none';if(tab!==lt){lt=tab;$('pbn').innerHTML=tab?`<img class="ban" src="thumb/panel_${tab}.jpg" data-n="0" data-id="panel_${tab}" alt="" onerror="tf(this)">`:''}if(tab){$('pt').textContent=T.find(t=>t[0]==tab)[2];$('ph').textContent=R(S.cash)+' · '+S.hrs+' jam';$('pm').innerHTML=V[tab]()}$('logs').innerHTML=S.logs.slice(0,3).join('<br>');sv()}
